<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>MAX</title>
<link rel="stylesheet" href="/static/orb.css">
</head>
<body>
<canvas id="orb" aria-hidden="true"></canvas>

<form id="login" class="hidden" autocomplete="off">
  <input id="passcode" type="password" placeholder="passcode" aria-label="Passcode" autocomplete="current-password">
</form>

<div id="activity" class="hidden" role="status" aria-live="polite"><span class="activity-icon" aria-hidden="true">&gt;_</span><span id="activity-text"></span></div>
<div id="answer" role="status" aria-live="polite"></div>
<a id="sandbox-link" class="hidden" target="_blank" rel="noopener noreferrer">Open PR sandbox run</a>
<button id="github-auth" class="hidden" type="button">Authorize app</button>
<button id="connections-toggle" class="hidden" type="button" hidden>Apps</button>
<form id="keybox" class="hidden" autocomplete="off">
  <a id="key-link" target="_blank" rel="noopener noreferrer">Create key</a>
  <input id="key-input" type="password" maxlength="300" placeholder="Paste API key" aria-label="API key">
  <button id="key-save" type="submit">Connect</button>
</form>
<section id="connections-panel" class="hidden" aria-label="Connected apps">
  <div class="connections-heading"><strong>MAX connections</strong><button id="connections-close" type="button">×</button></div>
  <p>Connect once in your browser. MAX handles MCP setup and asks before every tool action.</p>
  <div id="connections-list"></div>
</section>
<div id="choices" class="hidden">
  <button id="allow" type="button">Allow ⏎</button>
  <button id="deny" type="button">Deny esc</button>
</div>
<input id="input" class="hidden" type="text" maxlength="4000" aria-label="Message to MAX">
<div id="hint">type to talk · space or tap the orb to speak</div>
<button id="wake" type="button">“Hey MAX”: off</button>

<section id="context-panel" class="hidden" aria-label="Context usage">
  <div class="ctx-head">
    <strong>Context</strong>
    <div class="ctx-actions">
      <button id="ctx-refresh" type="button" title="Refresh context">↻</button>
      <button id="ctx-close" type="button" title="Close context">×</button>
    </div>
  </div>
  <div class="ctx-summary">
    <span id="ctx-pct">0% used</span>
    <span id="ctx-ratio" class="ctx-muted">0 / 128K</span>
  </div>
  <div id="ctx-bar" class="ctx-bar" aria-hidden="true"></div>
  <div id="ctx-rows" class="ctx-rows"></div>
  <div id="ctx-details" class="ctx-details"></div>
  <div id="ctx-foot" class="ctx-foot">Last updated just now. Send a message to refresh.</div>
</section>

<script src="/static/orb.js"></script>
</body>
</html>
