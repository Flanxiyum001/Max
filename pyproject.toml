[project]
name = "max-assistant"
version = "1.0.0a1"
description = "MAX — personal AI assistant core (v1: Discord text MVP on the Stage 2 foundation)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "discord.py>=2.3",
]

[project.optional-dependencies]
# Core stays lean: every capability below is opt-in and degrades cleanly.
codesearch = [
    "tree-sitter>=0.24",
    "tree-sitter-python>=0.23",
]
stt = [
    "faster-whisper>=1.2",
]
openhands = [
    # optional coding-worker backend (src/max/orchestration/coding.py);
    # not installed by default — MAX falls back to its own guarded runner.
    "openhands-sdk>=1.58,<2",
]
mcp = [
    "mcp>=1.2",
]
pc = [
    # Local native Windows WebView2 shell (self-contained HTML/JS, no CDN).
    "pywebview>=5.4,<7",
    # Optional microphone and Windows SAPI voice.
    "sounddevice>=0.5",
    "pyttsx3>=2.98",
]
desktop = [
    # local screen + mouse/keyboard driver for src/max/desktop/; optional so
    # a headless host (or a MAX without machine control) still installs and runs
    "pyautogui>=0.9.54",
]
dev = [
    "pytest>=8.0",
    # test-only: exercises the tree-sitter backend in CI; the regex
    # fallback is covered separately by the same tests when it is absent
    "tree-sitter>=0.24",
    "tree-sitter-python>=0.23",
]

[project.scripts]
max = "max.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"max.pc" = ["ui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
