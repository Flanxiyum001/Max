[project]
name = "max-assistant"
version = "1.0.0a1"
description = "MAX — personal AI assistant core (v1: Discord text MVP on the Stage 2 foundation)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "discord.py>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
max = "max.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
