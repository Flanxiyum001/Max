name: MAX native desktop smoke

on:
  pull_request:
    branches: [max]

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install optional native app
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'setuptools>=84.1.0,<85'
          python -m pip install -e '.[desktop,dev]'
      - name: Install Ubuntu Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 libdbus-1-3
      - name: Offscreen native window smoke
        run: python -m max_core.native_desktop --smoke-test
      - name: Native backend, window, and E2E tests
        run: python -m pytest -q tests/test_native_desktop_backend.py tests/test_native_desktop_qt.py tests/e2e
