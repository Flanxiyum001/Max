name: MAX Core checks

on:
  pull_request:
    branches: [max]
  push:
    branches: [max]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: max_ci
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: max_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U max_ci -d max_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only credentials for an ephemeral test container; no real account secrets.
      MAX_DATABASE_URL: postgresql+psycopg://max_ci:local-ci-only@localhost:5432/max_ci
      MAX_TEST_DATABASE_URL: postgresql+psycopg://max_ci:local-ci-only@localhost:5432/max_ci
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'setuptools>=84.1.0,<85'
          python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check src tests
      - name: Format check
        run: python -m ruff format --check src tests
      - name: Show format corrections on failure
        if: failure()
        run: python -m ruff format --diff src tests
      - name: Static typing
        run: python -m mypy src/max_core
      - name: Apply PostgreSQL migrations
        run: python -m alembic upgrade head
      - name: Unit and security tests
        run: python -m pytest -q
      - name: Dependency vulnerability audit
        run: python -m pip_audit --progress-spinner off
