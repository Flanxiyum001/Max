name: Windows PC smoke
on:
  push:
    branches: ["main", "feat/windows-jarvis-desktop-mvp"]
  pull_request:
    paths:
      - "src/max/pc/**"
      - "src/max/cli.py"
      - "pyproject.toml"
      - "tests/test_pc_*.py"
      - ".github/workflows/windows-pc.yml"

jobs:
  windows-pc:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app and tests
        shell: pwsh
        run: python -m pip install -e ".[dev]"
      - name: Headless PC unit tests
        shell: pwsh
        run: python -m pytest tests/test_pc_control.py tests/test_pc_voice.py -q
      - name: Check PC CLI without accessing hardware or network
        shell: pwsh
        run: |
          python -m max pc status --json
          python -m max pc smoke
