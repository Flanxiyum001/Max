name: Windows PC smoke
on:
  push:
    branches: ["main", "fix/pc-cinematic-orb-real-model-setup"]
  pull_request:
    paths:
      - "src/max/pc/**"
      - "src/max/cli.py"
      - "pyproject.toml"
      - "tests/test_pc_*.py"
      - ".github/workflows/windows-pc.yml"

jobs:
  windows-pc:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app and tests
        shell: pwsh
        run: python -m pip install -e ".[dev,pc]"
      - name: Verify native WebView dependency loads on Windows
        shell: pwsh
        run: |
          python -c "import webview; print('pywebview imported')"
      - name: Headless PC unit tests
        shell: pwsh
        run: python -m pytest tests/test_pc_control.py tests/test_pc_voice.py tests/test_pc_web_app.py tests/test_pc_automation.py tests/test_pc_handsfree.py tests/test_pc_remote.py -q
      - name: Validate embedded cinematic UI JavaScript
        shell: pwsh
        run: |
          python -c "from pathlib import Path; h=Path('src/max/pc/ui/index.html').read_text(encoding='utf-8'); Path('_max-ui-check.js').write_text(h.rsplit('<script>',1)[1].split('</script>',1)[0], encoding='utf-8')"
          node --check _max-ui-check.js
          Remove-Item _max-ui-check.js
      - name: Check PC CLI without accessing hardware or network
        shell: pwsh
        run: |
          python -m max pc status --json
          python -m max pc smoke
